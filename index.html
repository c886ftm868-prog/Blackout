<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLACKOUT – City Under Control</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#f4f5f9;background:#060910}*{box-sizing:border-box}body{margin:0}.app{max-width:1000px;margin:auto;min-height:100vh;background:#101825}header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#060910;border-bottom:3px solid #f9c627;gap:8px}.logo{font-size:clamp(23px,5vw,35px);font-weight:1000;font-style:italic;letter-spacing:-1.5px}.yellow{color:#ffcb32}.small{font-size:12px;color:#bac6d6}.main{padding:14px}.hero{position:relative;height:clamp(225px,52vw,490px);background:#080f1c center/cover;border:1px solid #495265;border-radius:12px;overflow:hidden}.hero:after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 38%,#050a13e9)}.overlay{position:absolute;z-index:2;bottom:15px;left:15px;right:15px;text-shadow:0 2px 8px #000}.big{font-size:clamp(32px,9vw,70px);font-style:italic;font-weight:1000;line-height:1}.tag{background:#ffcb32;color:#080a0e;padding:5px 10px;display:inline-block;font-weight:900;transform:skew(-5deg)}h1,h2,h3{margin:12px 0 8px}h2{font-size:clamp(21px,4vw,31px)}p{line-height:1.55}.panel{padding:15px;background:#1b293b;border:1px solid #40516a;border-radius:11px;margin:12px 0}.btn{display:block;width:100%;border:0;border-radius:10px;background:#ffcb32;color:#111;font-size:16px;font-weight:900;padding:15px;margin-top:12px;cursor:pointer;min-height:48px}.btn.secondary{background:#30435b;color:white}.btn:disabled{opacity:.45}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:9px}.opt{border:1px solid #52647c;background:#24344b;color:white;text-align:left;padding:13px;border-radius:9px;min-height:53px;font-size:15px;cursor:pointer}.opt.selected{border-color:#ffcb32;background:#574922}.notice{padding:12px;margin-top:12px;border-radius:8px;border-left:4px solid #5de0a3;background:#183b31}.notice.bad{background:#4b2a2b;border-color:#ff8d76}.scene{width:100%;aspect-ratio:16/7.4;object-fit:cover;border-radius:11px;border:1px solid #4b5d76;background:#111;display:block}.scene.moon{filter:brightness(.65) saturate(.85)}.progress{display:flex;gap:5px;margin:12px 0}.progress span{height:7px;flex:1;background:#38485e;border-radius:5px}.progress span.done{background:#ffcb32}.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:10px 0}.inventory{display:flex;gap:8px;flex-wrap:wrap}.slot{border:1px solid #566277;border-radius:8px;padding:9px;background:#192334;font-size:12px;flex:1;min-width:95px;text-align:center}.slot.earned{border-color:#e9bf2d;color:#ffd758}.wireboard{background:#172335;border:1px solid #4d6179;border-radius:10px;padding:10px}.wireboard svg{display:block;width:100%;max-height:260px}.term{border:1px solid #657993;background:#2a405b;color:#fff;border-radius:8px;padding:11px;cursor:pointer}.term:disabled{opacity:.35;cursor:not-allowed}.term.active{border-color:#ffcb32;background:#705c20}.termgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cutscene{position:relative;overflow:hidden;border-radius:12px}.cutscene img{width:100%;display:block;aspect-ratio:16/8;object-fit:cover}.cutscene .subtitle{background:#080e18e8;padding:15px;border-left:4px solid #ffcb32;line-height:1.55}.label{color:#ffcc36;font-weight:bold;font-size:13px}.end{text-align:center;padding:24px 10px}.end strong{font-size:clamp(30px,7vw,62px);color:#ffcb32;font-style:italic}.count{font-size:12px;color:#bdc9d9}.muted{color:#b9c5d3}.parts-tray{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 0}.part{background:#253951;border:1px solid #627994;color:white;border-radius:9px;padding:12px 3px;font-size:13px;cursor:grab;touch-action:pan-y}.part.used{border-color:#f9c627;background:#344f42}.assemble-surface{background:#101a29;border:1px solid #50617a;border-radius:12px;padding:10px}.assembly-caption{font-size:12px;font-weight:bold;color:#ffca32;letter-spacing:1px}.dropzones{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:9px 0}.dropzone{min-height:48px;display:grid;place-items:center;text-align:center;border:2px dashed #627b96;border-radius:8px;font-size:13px;color:#cbd5e1;padding:6px}.dropzone.filled{border-color:#58d4a1;color:#a7f3d0;background:#1c3d36}.cable-zones .dropzone{min-height:35px}.assemble-surface svg{width:100%;height:auto;touch-action:none}.cutscene img{animation:pan 9s ease-in-out infinite alternate}@keyframes pan{from{transform:scale(1)}to{transform:scale(1.075)}}@media(max-width:520px){.main{padding:10px}.scene{aspect-ratio:16/10}.panel{padding:12px}.opt{font-size:14px}.cutscene img{aspect-ratio:16/10}}
.switch-card{background:#182638;border:1px solid #546b86;padding:14px;border-radius:12px}.switch-parts{display:flex;gap:12px;margin:12px 0}.switch-parts .part{flex:1;min-height:70px;font-size:18px;touch-action:none}.switch-parts .part.selected{outline:3px solid #ffcb32}.switch-board{max-width:600px;margin:12px auto}.switch-board svg{width:100%;display:block;border-radius:10px;touch-action:none}.switch-visual{position:relative;background:#fff;border-radius:10px;max-width:360px;margin:12px auto;padding:10px}.switch-visual img{display:block;width:100%;height:auto}.switch-status{font-weight:800;text-align:center;padding:10px;border-radius:8px;background:#3b2e29}.switch-status.on{background:#1d503c;color:#adf3cb}.switch-controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.switch-controls button{min-height:50px}.switch-controls button.active{outline:3px solid #ffcb32}.switch-note{font-size:13px;color:#c8d5e5;margin:10px 0}</style></head><body><div class="app"><header><div class="logo">BLACK<span class="yellow">OUT</span></div><div class="small">CITY UNDER CONTROL<br>TECHNIK · KLASSE 9</div></header><main id="game" class="main"></main></div><script>
'use strict';const game=document.getElementById('game');let mission=0,task=0,phase='title',selected=[],edges=[],first='',placed=[],attempts=0,earned=[false,false,false],hint=false,voice=true,activeAudio=null,sceneNext=null;
const assets='assets/';const scenes=['scene_1.jpg','scene_5.jpg','scene_6.jpg','scene_6.jpg'];
const missions=[
{name:'Die Garage',topic:'Einfacher Stromkreis',reward:'Zugangskarte',intro:'Rico: „In der ganzen Stadt ist der Strom weg. Durch das Fenster fällt nur Mondlicht. Auf der Werkbank liegen verschiedene Teile. Wir brauchen Licht, bevor wir weiterkommen. Finde einen Weg!“',scene:'scene_1.jpg',tasks:[
{type:'multi',title:'Materialsuche',text:'Du siehst verschiedene Gegenstände auf der Werkbank. Wähle genau drei Bauteilarten, mit denen du eine einfache Notbeleuchtung ohne Schalter bauen kannst.',options:['Batterie','Lampe','Leitungen','Holzklotz','Klebeband','Schraubendreher','Steckdose','Schalter'],correct:[0,1,2],hint:'Du brauchst eine Spannungsquelle, einen Verbraucher und Verbindungen.'},
{type:'assemble',title:'Baue einen einfachen Stromkreis',text:'Auf der Werkbank liegen eine Batterie, eine Lampe und zwei einzelne Leitungen. Ziehe die Bauteile auf die Arbeitsfläche. Verbinde danach die Batterie mit der Lampe. Du entscheidest, welcher Anschluss wohin gehört.',hint:'Für einen geschlossenen Stromkreis brauchst du zwei Verbindungen: von einem Batteriepol zu einem Lampenanschluss und vom anderen Batteriepol zum zweiten Lampenanschluss.'},
{type:'multi',title:'Die Lampe geht aus',text:'Die Lampe leuchtet kurz, flackert und geht wieder aus. Welche drei Ursachen könnten grundsätzlich dafür verantwortlich sein?',options:['Die Batterie ist fast leer.','Eine Leitung hat einen Wackelkontakt.','Die Lampe ist defekt.','Eine intakte Leitung schaltet die Lampe automatisch aus.'],correct:[0,1,2],hint:'Welche Fehler können den Stromfluss unterbrechen?'},
{type:'clue',title:'Spuren untersuchen',text:'Du kennst mehrere mögliche Ursachen. Suche jetzt einen Hinweis in der Garage, bevor du reparierst.',options:['Werkzeugkiste untersuchen','Kabelkanal untersuchen','Fenster untersuchen'],correct:1,hint:'Suche dort, wo die Leitungen entlanglaufen.'},
{type:'single',title:'Reparatur durchführen',text:'Du hast eine beschädigte, gelöste Leitung gefunden. Die Batterie ist noch geladen. Was ist die richtige und sichere Reparatur?',options:['Die beschädigte Leitung entfernen und durch eine intakte ersetzen. Danach die Anschlüsse sicher befestigen.','Die beiden Batterieanschlüsse direkt miteinander verbinden.','Die beschädigte Isolierung ignorieren und weiterarbeiten.','Eine Steckdose anstelle der Batterie verwenden.'],correct:0,hint:'Die beschädigte Leitung darf nicht weiterverwendet werden.'},
{type:'switch',title:'Offener oder geschlossener Stromkreis?',text:'Die Leitung ist repariert. Jetzt prüfst du den Schalter. Schalte die Lampe ein und wieder aus. Entscheide anschließend, wann der Stromkreis geschlossen ist.',hint:'Bei geschlossenem Schalter ist der Stromweg vollständig. Bei offenem Schalter ist er unterbrochen.'}
]},
{name:'Der Tunnel',topic:'Reihenschaltung',reward:'Energiezelle',intro:'Rico: „Mit der Zugangskarte kommen wir in den Tunnel. Hier gibt es nur einen Stromweg für mehrere Leuchten. Prüfe die Anlage, bevor wir weitergehen.“',scene:'scene_5.jpg',tasks:[
{type:'single',title:'Schaltung erkennen',text:'Zwei Lampen sind in einer Reihe geschaltet. Wie heißt diese Schaltungsart?',options:['Parallelschaltung','Reihenschaltung','Zwei getrennte Stromkreise'],correct:1,hint:'Bei einer Reihenschaltung sind die Lampen in einer Reihe geschaltet. Der Strom fließt nacheinander durch beide Lampen.'},
{type:'wire',title:'Tunnelbeleuchtung bauen',text:'Verbinde die Batterie und beide Lampen zu einer Reihenschaltung. Der Stromweg soll von Batterie + über Lampe 1 und Lampe 2 zurück zu Batterie − führen.',hint:'Baue eine einzige geschlossene Kette ohne Abzweigung.'},
{type:'single',title:'Leuchtstärke prüfen',text:'Du ergänzt bei gleicher Batterie eine zweite gleiche Lampe in Reihe. Was beobachtest du normalerweise?',options:['Beide Lampen leuchten schwächer als eine einzelne.','Beide Lampen leuchten stärker.','Die Batterie liefert automatisch die doppelte Spannung.'],correct:0,hint:'Die vorhandene Spannung verteilt sich auf die beiden Lampen.'},
{type:'single',title:'Defekte Lampe',text:'Eine Lampe im Tunnel fällt aus und unterbricht den Stromweg. Was passiert mit der anderen Lampe?',options:['Sie bleibt an.','Sie geht ebenfalls aus.','Sie leuchtet doppelt so hell.'],correct:1,hint:'Es gibt nur einen geschlossenen Weg.'},
{type:'single',title:'Tunnel reparieren',text:'Du findest eine durchgebrannte Lampe. Wie stellst du die Reihenschaltung sicher wieder her?',options:['Die defekte Lampe bei getrennter Spannungsquelle durch eine passende ersetzen und die Verbindung prüfen.','Die Batterie kurzschließen.','Die defekte Lampe mit nassen Händen herausdrehen.'],correct:0,hint:'Ersetze das defekte Bauteil und kontrolliere den einzigen Stromweg.'}
]},
{name:'Das Umspannwerk',topic:'Parallelschaltung',reward:'Steuerungschip',intro:'Maya: „Wir sind am Umspannwerk. Hier sollen zwei Lampengruppen unabhängig voneinander arbeiten. Eine darf nicht die andere ausschalten. Zeig, wie das geht.“',scene:'scene_6.jpg',tasks:[
{type:'single',title:'Die richtige Schaltung',text:'Zwei Lampen sollen unabhängig voneinander leuchten. Welche Schaltung ist geeignet?',options:['Reihenschaltung','Parallelschaltung','Offener Stromkreis'],correct:1,hint:'Du brauchst mehrere Stromwege.'},
{type:'wire',title:'Zwei Stromzweige bauen',text:'Verbinde zwei Lampen parallel mit der Batterie. Jede Lampe braucht ihren eigenen Hin- und Rückweg zu den Batteriepolen.',hint:'Beide Lampen liegen jeweils zwischen Batterie + und Batterie −.'},
{type:'single',title:'Ausfall simulieren',text:'Lampe 1 wird defekt und unterbricht nur ihren eigenen Zweig. Was passiert mit Lampe 2?',options:['Sie geht ebenfalls aus.','Sie bleibt an, wenn ihr Zweig intakt ist.','Sie benötigt automatisch eine neue Batterie.'],correct:1,hint:'Die Stromzweige sind unabhängig voneinander.'},
{type:'single',title:'Fehler suchen',text:'Lampe 1 leuchtet, Lampe 2 nicht. Die Batterie ist in Ordnung. Welche Stelle prüfst du zuerst?',options:['Nur den Zweig von Lampe 2.','Die Leitung vor allen Abzweigungen auf Verdacht durchtrennen.','Den intakten Zweig von Lampe 1 entfernen.'],correct:0,hint:'Ein Zweig funktioniert bereits.'},
{type:'single',title:'Sicher reparieren',text:'Eine Leitung im zweiten Zweig ist beschädigt. Welche Maßnahme ist richtig?',options:['Spannungsquelle trennen, beschädigte Leitung ersetzen und die Verbindung prüfen.','Die beiden Batterieanschlüsse miteinander verbinden.','Die Leitung während des Betriebs blank anfassen.'],correct:0,hint:'Erst spannungsfrei schalten, dann reparieren.'}
]},
{name:'Die Schaltzentrale',topic:'Finale – alle Schaltungsarten',reward:'MISSION COMPLETE',intro:'Rico: „Zugangskarte, Energiezelle und Steuerungschip sind da. Die letzte Tür ist offen. Jetzt zählt alles, was du gelernt hast. Bring die Stadt zurück ans Netz!“',scene:'scene_6.jpg',tasks:[
{type:'single',title:'Notbeleuchtung',text:'Ein einfacher Stromkreis bleibt dunkel. Batterie und Lampe sind intakt. Welche Voraussetzung prüfst du?',options:['Ob der Stromkreis geschlossen ist.','Ob die Leitung besonders lang ist.','Ob eine zweite Lampe danebenliegt.'],correct:0,hint:'Strom kann nur durch einen geschlossenen Stromweg fließen.'},
{type:'wire',title:'Sicherheitskreis bauen',text:'Baue einen Stromkreis mit zwei Lampen in Reihe. Verbinde Batterie + → Lampe 1 → Lampe 2 → Batterie −.',hint:'Eine einzige Kette mit drei Leitungen.'},
{type:'wire',title:'Stadtbeleuchtung bauen',text:'Jetzt sollen zwei Lampen unabhängig leuchten. Baue eine Parallelschaltung mit vier Leitungen.',hint:'Jede Lampe braucht eine Verbindung zu Plus und zu Minus.'},
{type:'single',title:'Kombinierte Anlage',text:'Eine Kontrolllampe soll mit beiden parallelen Beleuchtungszweigen zusammen ausgehen. Wie muss die Kontrolllampe eingebaut werden?',options:['In Reihe vor der Verzweigung, während die zwei Beleuchtungslampen parallel liegen.','Parallel nur zu einer der beiden Lampen.','Ohne Verbindung zur Spannungsquelle.'],correct:0,hint:'Ein gemeinsamer Abschnitt liegt vor der Aufteilung in zwei Zweige.'},
{type:'single',title:'Hauptschalter freigeben',text:'Bei der kombinierten Anlage leuchtet die Kontrolllampe, aber nur eine der beiden parallelen Lampen. Welche Aussage ist am wahrscheinlichsten?',options:['Der gemeinsame Stromweg ist vollständig unterbrochen.','Ein Fehler liegt im Zweig der dunklen Lampe.','Beide Zweige sind sicher in Ordnung.'],correct:1,hint:'Wenn ein Zweig leuchtet, ist die gemeinsame Versorgung vorhanden.'}
]}
];
const img=(name,cl='scene')=>`<img class="${cl}" src="${assets+name}" alt="GTA-inspirierte Illustration zur Mission">`;
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function button(label,fn,secondary=false){let b=document.createElement('button');b.className='btn'+(secondary?' secondary':'');b.textContent=label;b.onclick=fn;return b}
function addButton(label,fn,secondary=false){game.appendChild(button(label,fn,secondary))}
function speech(text){if(!voice||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text.replace(/^.*?: /,''));u.lang='de-DE';u.rate=.93;u.pitch=.94;speechSynthesis.speak(u)}catch(e){}}
function soundtrack(){try{activeAudio=new(window.AudioContext||window.webkitAudioContext)();activeAudio.resume();let now=activeAudio.currentTime;let notes=[55,65.4,73.42,49,55,82.4,65.4,49];for(let i=0;i<32;i++){let t=now+i*.3,o=activeAudio.createOscillator(),g=activeAudio.createGain();o.type=i%4===0?'sawtooth':'triangle';o.frequency.value=notes[i%8]*(i%8===0?2:1);g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(.065,t+.025);g.gain.exponentialRampToValueAtTime(.001,t+.26);o.connect(g);g.connect(activeAudio.destination);o.start(t);o.stop(t+.27)}for(let i=0;i<20;i++){let t=now+i*.48,o=activeAudio.createOscillator(),g=activeAudio.createGain();o.type='sine';o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(40,t+.13);g.gain.setValueAtTime(.045,t);g.gain.exponentialRampToValueAtTime(.001,t+.15);o.connect(g);g.connect(activeAudio.destination);o.start(t);o.stop(t+.17)}}catch(e){}}
function title(){phase='title';game.innerHTML=`<img src="${assets}cover.jpg" alt="BLACKOUT – Stromausfall in der ganzen Stadt – Spiel starten" style="display:block;width:100%;height:auto;border-radius:12px;border:1px solid #495265" /><h2>Vier Missionen. Drei Gegenstände. Eine Stadt.</h2><p>Der Strom ist ausgefallen. Baue Schaltungen, finde Fehler und sichere die drei Gegenstände für die letzte Mission.</p><div class="panel"><b>🎮 SPIELREGELN</b><p>Du kannst jede Aufgabe erneut versuchen. Erst eine richtige Lösung schaltet den nächsten Auftrag frei. Kopfhörer empfohlen.</p></div>`;addButton('▶ 10-SEKUNDEN-INTRO MIT MUSIK',()=>{soundtrack();game.innerHTML=`<img src="${assets}cover.jpg" alt="BLACKOUT – Stromausfall in der ganzen Stadt" style="display:block;width:100%;height:auto;border-radius:12px;border:1px solid #495265" /><p class="yellow"><b>INTRO LÄUFT …</b></p><p class="small">Musik läuft, sofern dein Browser Ton erlaubt. Die Mission beginnt nach zehn Sekunden.</p>`;setTimeout(()=>cutscene(0),10000)})}
function cutscene(m){phase='cutscene';mission=m;task=0;selected=[];edges=[];let d=missions[m];game.innerHTML=`<div class="meta"><b class="yellow">MISSION ${m+1} / 4</b><span class="small">ZWISCHENSEQUENZ · UNTERTITEL</span></div><div class="cutscene">${img(d.scene)}<div class="subtitle"><div class="label">${m===2?'MAYA':'RICO'} // FUNK</div>${escapeHtml(d.intro.replace(/^.*?: /,''))}</div></div><h2>${escapeHtml(d.name)}</h2><p>${escapeHtml(d.topic)}</p><div class="panel">🔊 <button id="voice" class="opt" style="width:auto">${voice?'Sprachausgabe: AN':'Sprachausgabe: AUS'}</button><p class="small">Deutsche Gerätestimme, sofern verfügbar. Untertitel bleiben sichtbar.</p></div>`;game.querySelector('#voice').onclick=()=>{voice=!voice;game.querySelector('#voice').textContent='Sprachausgabe: '+(voice?'AN':'AUS');if(voice)speech(d.intro);else if('speechSynthesis'in window)speechSynthesis.cancel()};speech(d.intro);addButton('MISSION STARTEN',()=>renderTask())}
function inventory(){return `<div class="inventory">${['🪪 Zugangskarte','🔋 Energiezelle','▣ Steuerungschip'].map((x,i)=>`<div class="slot ${earned[i]?'earned':''}">${earned[i]?'✓':'🔒'} ${x}</div>`).join('')}</div>`}
function progress(){return `<div class="progress">${missions[mission].tasks.map((_,i)=>`<span class="${i<=task?'done':''}"></span>`).join('')}</div>`}
function renderTask(){phase='task';selected=[];edges=[];first='';placed=[];hint=false;let d=missions[mission],t=d.tasks[task];let image=mission===0?(['scene_2.jpg','scene_3.jpg','scene_4.jpg','scene_1.jpg','scene_2.jpg','scene_3.jpg'][task]):d.scene;game.innerHTML=`<div class="meta"><b class="yellow">MISSION ${mission+1} – ${escapeHtml(d.name.toUpperCase())}</b><span class="count">AUFTRAG ${task+1} / ${d.tasks.length}</span></div>${inventory()}${progress()}${img(image,mission===0&&task===0?'scene moon':'scene')}<h2>${escapeHtml(t.title)}</h2><div class="panel">${escapeHtml(t.text)}</div><div id="interaction"></div><div id="feedback" aria-live="polite"></div><div id="actions"></div>`;let box=game.querySelector('#interaction');if(t.type==='switch'){buildSwitch(box)}else if(t.type==='multi'||t.type==='single'){box.className='options';t.options.forEach((opt,i)=>{let b=document.createElement('button');b.className='opt';b.textContent=opt;b.onclick=()=>{if(t.type==='single')selected=[i];else selected=selected.includes(i)?selected.filter(x=>x!==i):[...selected,i];box.querySelectorAll('button').forEach((v,j)=>v.classList.toggle('selected',selected.includes(j)))};box.appendChild(b)})}else if(t.type==='clue'){box.innerHTML='<div class="options"></div><div id="clueText"></div>';t.options.forEach((opt,i)=>{let b=document.createElement('button');b.className='opt';b.textContent=opt;b.onclick=()=>{selected=[i];box.querySelector('#clueText').innerHTML=`<div class="notice ${i===1?'':'bad'}">${i===1?'SPUR GEFUNDEN: Im Kabelkanal hängt eine Leitung lose herunter. Die Isolierung ist beschädigt. Die Batterieanzeige zeigt noch ausreichend Ladung.':'Hier ist kein brauchbarer Hinweis zu finden.'}</div>`};box.querySelector('.options').appendChild(b)})}else if(t.type==='assemble'){buildAssembly(box)}else if(t.type==='wire'){buildWires(box)}let actions=game.querySelector('#actions');actions.appendChild(button('AUFTRAG PRÜFEN',check));actions.appendChild(button('HINWEIS ANZEIGEN',()=>{game.querySelector('#feedback').innerHTML=`<div class="notice">💡 ${escapeHtml(t.hint)}</div>`},true))}
function matchAssembly(){let canon=e=>e.slice().sort().join('|');return ['battery','lamp','cable1','cable2'].every(x=>placed.includes(x))&&edges.length===2&&[["plus","top"],["minus","bottom"]].every(pair=>edges.some(e=>canon(e)===canon(pair)))||['battery','lamp','cable1','cable2'].every(x=>placed.includes(x))&&edges.length===2&&[["plus","bottom"],["minus","top"]].every(pair=>edges.some(e=>canon(e)===canon(pair)))}
function buildAssembly(box){
placed=[];edges=[];first='';
box.innerHTML=`<div class="wireboard assembly"><p class="small"><b>1.</b> Lege Batterie, Lampe, Leitung 1 und Leitung 2 auf die Werkbank (antippen oder ziehen). <b>2.</b> Verbinde die Anschlüsse: Tippe auf einen Anschluss und anschließend auf einen zweiten. Du kannst auch mit dem Finger von Anschluss zu Anschluss ziehen.</p><div class="parts-tray" id="partsTray"><button class="part" draggable="true" data-part="battery">🔋<br>Batterie</button><button class="part" draggable="true" data-part="lamp">💡<br>Lampe</button><button class="part" draggable="true" data-part="cable1">〰️<br>Leitung 1</button><button class="part" draggable="true" data-part="cable2">〰️<br>Leitung 2</button></div><div class="assemble-surface" id="assemblySurface"><div class="assembly-caption">WERKBANK · EINFACHER STROMKREIS</div><div class="dropzones"><div class="dropzone" data-accept="battery">Batterie ablegen</div><div class="dropzone" data-accept="lamp">Lampe ablegen</div></div><div class="dropzones cable-zones"><div class="dropzone" data-accept="cable1">Leitung 1 ablegen</div><div class="dropzone" data-accept="cable2">Leitung 2 ablegen</div></div><svg id="assemblySvg" viewBox="0 0 400 230" role="img" aria-label="Stromkreis mit Batterie, Lampe und sichtbaren Kabeln"><g id="assemblyWires"></g><g id="assemblyParts"></g><g id="assemblyPorts"></g><path id="previewWire" d="" fill="none" stroke="#ffd447" stroke-width="6" stroke-dasharray="7 5"/></svg><div class="termgrid" id="assemblyButtons"></div><p class="small" id="assemblyStatus" aria-live="polite">Lege zuerst die vier Bauteile auf die Werkbank.</p></div></div>`;
const tray=box.querySelector('#partsTray'),svg=box.querySelector('#assemblySvg');
const pos={plus:[100,94],minus:[100,164],top:[300,94],bottom:[300,164]};
const labels={plus:'Batterie +',minus:'Batterie −',top:'Lampe Anschluss A',bottom:'Lampe Anschluss B'};
let dragging=null,dragMoved=false;
function place(id){if(placed.includes(id))return;placed.push(id);tray.querySelector('[data-part="'+id+'"]').classList.add('used');let slot=box.querySelector('[data-accept="'+id+'"]');slot.classList.add('filled');slot.textContent='✓ '+({battery:'Batterie',lamp:'Lampe',cable1:'Leitung 1',cable2:'Leitung 2'})[id]+' bereit';renderBoard()}
tray.querySelectorAll('.part').forEach(b=>{b.addEventListener('click',()=>place(b.dataset.part));b.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',b.dataset.part))});
box.querySelectorAll('.dropzone').forEach(z=>{z.addEventListener('dragover',e=>e.preventDefault());z.addEventListener('drop',e=>{e.preventDefault();let id=e.dataTransfer.getData('text/plain');if(id===z.dataset.accept)place(id)})});
function available(id){return (id==='plus'||id==='minus')?placed.includes('battery'):placed.includes('lamp')}
function connect(a,b){if(!available(a)||!available(b)||a===b||placed.filter(x=>x.startsWith('cable')).length<2)return false;if(edges.length>=2||edges.some(e=>e.includes(a)||e.includes(b)))return false;edges.push([a,b]);return true}
function choose(id){if(!available(id))return;if(!first){first=id}else if(first===id){first=''}else{connect(first,id);first=''}renderBoard()}
function renderBoard(){let battery=placed.includes('battery'),lamp=placed.includes('lamp');let completed=matchAssembly();
box.querySelector('#assemblyParts').innerHTML=(battery?'<rect x="34" y="55" width="130" height="150" rx="12" fill="#303c50" stroke="#a8b9cc" stroke-width="3"/><text x="99" y="128" text-anchor="middle" fill="white" font-size="16" font-weight="bold">BATTERIE</text><text x="99" y="151" text-anchor="middle" fill="#ffcb32" font-size="14">+ / −</text>':'')+(lamp?'<circle cx="300" cy="129" r="35" fill="'+(completed?'#ffe29c':'#d6e4f5')+'" stroke="'+(completed?'#ffca32':'#a3b9cf')+'" stroke-width="4"/><path d="M278 107 L322 151 M322 107 L278 151" stroke="#657185" stroke-width="3"/><text x="300" y="203" text-anchor="middle" fill="white" font-size="15">LAMPE</text>':'');
box.querySelector('#assemblyWires').innerHTML=edges.map((e,i)=>{let a=pos[e[0]],b=pos[e[1]];return '<path d="M'+a.join(' ')+' C195 '+a[1]+',205 '+b[1]+','+b.join(' ')+'" fill="none" stroke="'+(i===0?'#ff6464':'#60b9ff')+'" stroke-width="8" stroke-linecap="round"/>'}).join('');
box.querySelector('#assemblyPorts').innerHTML=Object.keys(pos).filter(available).map(id=>'<circle data-port="'+id+'" cx="'+pos[id][0]+'" cy="'+pos[id][1]+'" r="15" fill="'+(first===id?'#ffcb32':'#e8f3ff')+'" stroke="#111827" stroke-width="3"/><text x="'+(pos[id][0]+(id==='plus'||id==='minus'?-26:27))+'" y="'+(pos[id][1]+5)+'" fill="white" font-size="15" text-anchor="middle">'+({plus:'+',minus:'−',top:'A',bottom:'B'})[id]+'</text>').join('');
let buttons=box.querySelector('#assemblyButtons');buttons.innerHTML='';Object.keys(pos).forEach(id=>{let b=document.createElement('button');b.type='button';b.className='term'+(first===id?' active':'');b.textContent=labels[id];b.disabled=!available(id);b.onclick=()=>choose(id);buttons.appendChild(b)});
box.querySelector('#assemblyStatus').textContent=placed.length+' von 4 Bauteilen bereit · '+edges.length+' von 2 Leitungen sichtbar verbunden.'+(first?' Zweiten Anschluss wählen.':'')+(completed?' Stromkreis geschlossen!':'');}
function portAt(x,y){let r=svg.getBoundingClientRect(),px=(x-r.left)*400/r.width,py=(y-r.top)*230/r.height;return Object.keys(pos).find(id=>available(id)&&Math.hypot(pos[id][0]-px,pos[id][1]-py)<27)||null}
function coords(x,y){let r=svg.getBoundingClientRect();return [(x-r.left)*400/r.width,(y-r.top)*230/r.height]}
svg.addEventListener('pointerdown',e=>{let id=portAt(e.clientX,e.clientY);if(!id)return;dragging={id,x:e.clientX,y:e.clientY};dragMoved=false;e.preventDefault()});
svg.addEventListener('pointermove',e=>{if(!dragging)return;if(Math.hypot(e.clientX-dragging.x,e.clientY-dragging.y)>8)dragMoved=true;if(dragMoved){let [x,y]=coords(e.clientX,e.clientY);box.querySelector('#previewWire').setAttribute('d','M'+pos[dragging.id].join(' ')+' L'+x+' '+y)}});
svg.addEventListener('pointerup',e=>{if(!dragging)return;let id=dragging.id,dest=portAt(e.clientX,e.clientY);box.querySelector('#previewWire').setAttribute('d','');dragging=null;if(dragMoved&&dest&&dest!==id){connect(id,dest);first='';renderBoard()}else choose(id)});
svg.addEventListener('pointercancel',()=>{dragging=null;box.querySelector('#previewWire').setAttribute('d','')});
box.appendChild(button('LEITUNGEN ENTFERNEN UND NEU VERBINDEN',()=>{edges=[];first='';renderBoard()},true));renderBoard();
}
function buildSwitch(box){
let installed=false,closed=false,seenOpen=false,seenClosed=false,selectedPart='';
box.innerHTML=`<div class="switch-card"><p><b>1. Baue den Schalter selbst in den Stromkreis ein.</b> Ziehe das Schalter-Symbol auf die gelb markierte Lücke im Stromkreis. Auf dem Tablet kannst du auch erst das Symbol und dann die Lücke antippen.</p>
<div class="switch-parts"><button class="part" id="switchPart" draggable="true" type="button" aria-label="Schalter-Symbol zum Einbauen">◯╱◯<br><b>Schalter</b></button><button class="part" id="lampDecoy" draggable="true" type="button">⊗<br><b>Lampe</b></button></div>
<div class="switch-board"><svg id="switchCircuit" viewBox="0 0 360 240" role="img" aria-label="Stromkreis mit Batterie, Lampe und einer Lücke für den Schalter">
<rect width="360" height="240" rx="10" fill="#f7f8fa"/>
<g stroke="#111" stroke-width="3" fill="none" stroke-linecap="round"><path d="M58 72 H132 M222 72 H305 V171 H199 M161 171 H58 V72"/><path d="M58 72 V118 M58 152 V171"/><path d="M43 118 H73 M50 128 H66 M43 139 H73 M50 152 H66"/></g>
<g fill="#111" font-size="15"><text x="37" y="114">+</text><text x="37" y="160">−</text></g>
<circle id="switchLamp" cx="180" cy="171" r="19" fill="white" stroke="#111" stroke-width="3"/><path d="M167 158 L193 184 M193 158 L167 184" stroke="#111" stroke-width="2.5"/>
<g id="switchInstalled" style="display:none" stroke="#111" stroke-width="3" fill="none"><circle cx="132" cy="72" r="4" fill="#111"/><circle cx="222" cy="72" r="4" fill="#111"/><path id="switchArm" d="M132 72 L207 38"/></g>
<g id="switchGap" role="button" tabindex="0" aria-label="Einbauplatz für den Schalter"><rect x="120" y="38" width="114" height="67" rx="9" fill="#ffcb3233" stroke="#d6a000" stroke-width="2.5" stroke-dasharray="7 5"/><text x="177" y="66" fill="#665200" text-anchor="middle" font-size="12" font-weight="bold">SCHALTER</text><text x="177" y="83" fill="#665200" text-anchor="middle" font-size="12">HIER EINBAUEN</text></g>
<text x="180" y="221" text-anchor="middle" fill="#344054" font-size="12">Schaltzeichnung · Kleinspannung</text></svg></div>
<div id="switchInstallStatus" class="small">Der Stromkreis ist noch unvollständig. Der Schalter fehlt.</div>
<div id="switchOperation" style="display:none"><p><b>2. Betätige den eingebauten Schalter.</b> Öffne und schließe ihn. Beobachte die Lampe.</p><div class="switch-controls"><button class="opt" id="openSwitch" type="button">Schalter öffnen</button><button class="opt" id="closeSwitch" type="button">Schalter schließen</button></div><div class="switch-status" id="switchStatus">SCHALTER OFFEN · LAMPE AUS</div><p id="switchObserved" class="small">Teste beide Schalterstellungen.</p><div id="switchQuestion" style="display:none"><p><b>3. Wann ist der Stromkreis geschlossen und die Lampe leuchtet?</b></p><div class="options"><button class="opt" data-switch-answer="0">Wenn der Schalter offen ist.</button><button class="opt" data-switch-answer="1">Wenn der Schalter geschlossen ist.</button><button class="opt" data-switch-answer="2">Wenn die Batterie entfernt wird.</button></div></div></div></div>`;
const part=box.querySelector('#switchPart'),gap=box.querySelector('#switchGap'),status=box.querySelector('#switchInstallStatus');
function install(id){if(id!=='switch'){status.textContent='Das passt nicht in die Lücke. Suche das Schalter-Symbol.';return}installed=true;gap.style.display='none';box.querySelector('#switchInstalled').style.display='';box.querySelector('#switchOperation').style.display='block';part.classList.add('used');status.textContent='Schalter eingebaut! Jetzt kannst du den Stromkreis öffnen und schließen.'}
function select(id){selectedPart=id;box.querySelectorAll('.switch-parts .part').forEach(x=>x.classList.toggle('selected',x===(id==='switch'?part:box.querySelector('#lampDecoy'))));status.textContent=id==='switch'?'Schalter ausgewählt. Tippe auf die gelbe Lücke.':'Bauteil ausgewählt. Tippe auf die Lücke, um es zu testen.'}
part.addEventListener('click',()=>select('switch'));box.querySelector('#lampDecoy').addEventListener('click',()=>select('lamp'));
box.querySelectorAll('.switch-parts .part').forEach(el=>el.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',el.id==='switchPart'?'switch':'lamp')}));
const svg=box.querySelector('#switchCircuit');svg.addEventListener('dragover',e=>e.preventDefault());svg.addEventListener('drop',e=>{e.preventDefault();install(e.dataTransfer.getData('text/plain'))});
gap.addEventListener('click',()=>install(selectedPart));gap.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();install(selectedPart)}});
// Touch pointer drag: supports dragging the symbol directly onto the SVG gap.
let moving=null;box.querySelectorAll('.switch-parts .part').forEach(el=>{el.addEventListener('pointerdown',e=>{moving={id:el.id==='switchPart'?'switch':'lamp',x:e.clientX,y:e.clientY};});el.addEventListener('pointerup',e=>{if(!moving)return;const r=svg.getBoundingClientRect();if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom){let pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;let m=svg.getScreenCTM();if(m){let p=pt.matrixTransform(m.inverse());if(p.x>=120&&p.x<=234&&p.y>=38&&p.y<=105)install(moving.id)}}moving=null});el.addEventListener('pointercancel',()=>moving=null)});
function update(v){if(!installed)return;closed=v;if(v)seenClosed=true;else seenOpen=true;box.querySelector('#switchArm').setAttribute('d',v?'M132 72 H222':'M132 72 L207 38');box.querySelector('#switchLamp').setAttribute('fill',v?'#ffe48a':'#ffffff');box.querySelector('#switchStatus').textContent=v?'SCHALTER GESCHLOSSEN · LAMPE LEUCHTET':'SCHALTER OFFEN · LAMPE AUS';box.querySelector('#switchStatus').classList.toggle('on',v);box.querySelector('#switchObserved').textContent=v?'Der Stromkreis ist geschlossen. Die Lampe leuchtet.':'Der Stromkreis ist offen. Die Lampe ist aus.';if(seenOpen&&seenClosed)box.querySelector('#switchQuestion').style.display='block'}
box.querySelector('#openSwitch').onclick=()=>update(false);box.querySelector('#closeSwitch').onclick=()=>update(true);
box.querySelectorAll('[data-switch-answer]').forEach(b=>b.onclick=()=>{selected=[Number(b.dataset.switchAnswer)];box.querySelectorAll('[data-switch-answer]').forEach(x=>x.classList.toggle('selected',x===b))});
}
function wireConfig(){let two=mission===0;let parallel=mission===2||(mission===3&&task===2);let nodes=two?['B+','B−','L1a','L1b']:['B+','B−','L1a','L1b','L2a','L2b'];let target=two?[[0,2],[1,3]]:parallel?[[0,2],[1,3],[0,4],[1,5]]:[[0,2],[3,4],[5,1]];return{nodes,target,parallel}}
function buildWires(box){let cfg=wireConfig();box.innerHTML=`<div class="wireboard"><svg viewBox="0 0 400 190" aria-label="Bauteile und selbst gelegte Leitungen"><rect x="15" y="35" width="98" height="115" rx="10" fill="#33455a" stroke="#9fb3c9"/><text x="64" y="55" fill="white" font-size="13" text-anchor="middle">BATTERIE</text><text x="64" y="84" fill="#fbd15c" font-size="18" text-anchor="middle">+ / −</text><circle cx="235" cy="60" r="23" fill="#dce5ef" stroke="#8297b0" stroke-width="3"/><path d="M219 44L251 76 M251 44L219 76" stroke="#536477" stroke-width="3"/><text x="235" y="98" fill="white" text-anchor="middle" font-size="13">LAMPE 1</text>${cfg.nodes.length>4?'<circle cx="344" cy="60" r="23" fill="#dce5ef" stroke="#8297b0" stroke-width="3"/><path d="M328 44L360 76 M360 44L328 76" stroke="#536477" stroke-width="3"/><text x="344" y="98" fill="white" text-anchor="middle" font-size="13">LAMPE 2</text>':''}<g id="lines"></g></svg><p class="small">Tippe nacheinander auf zwei Anschlüsse, um eine Leitung zu legen.</p><div class="termgrid" id="termgrid"></div><p class="small" id="wireCount"></p></div>`;let grid=box.querySelector('#termgrid');cfg.nodes.forEach((n,i)=>{let b=document.createElement('button');b.className='term';b.textContent=({'B+':'Batterie +','B−':'Batterie −','L1a':'Lampe 1, Anschluss A','L1b':'Lampe 1, Anschluss B','L2a':'Lampe 2, Anschluss A','L2b':'Lampe 2, Anschluss B'})[n];b.onclick=()=>{if(first===''){first=i;b.classList.add('active')}else{if(i!==first&&!edges.some(e=>e.includes(i)&&e.includes(first))){edges.push([first,i])}first='';grid.querySelectorAll('button').forEach(x=>x.classList.remove('active'));drawWires(box,cfg)}};grid.appendChild(b)});let reset=button('ALLE LEITUNGEN ENTFERNEN',()=>{edges=[];first='';grid.querySelectorAll('button').forEach(x=>x.classList.remove('active'));drawWires(box,cfg)},true);box.appendChild(reset);drawWires(box,cfg)}
function drawWires(box,cfg){let pos=[[113,65],[113,130],[209,43],[209,79],[318,43],[318,79]];box.querySelector('#lines').innerHTML=edges.map((e,i)=>`<path d="M${pos[e[0]].join(' ')} L${pos[e[1]].join(' ')}" stroke="${['#f76f73','#68bbf9','#f9ca45','#6de0b2'][i%4]}" stroke-width="4" fill="none"/>`).join('');box.querySelector('#wireCount').textContent=`${edges.length} Leitungen gelegt · benötigt: ${cfg.target.length}`}
function matchWires(){let cfg=wireConfig(),canon=e=>e.slice().sort((a,b)=>a-b).join('-');return edges.length===cfg.target.length&&cfg.target.every(e=>edges.some(x=>canon(x)===canon(e)))}
function check(){let t=missions[mission].tasks[task];let good=t.type==='switch'?selected.length===1&&selected[0]===1&&!!game.querySelector('#switchQuestion')&&game.querySelector('#switchQuestion').style.display==='block':t.type==='assemble'?matchAssembly():t.type==='wire'?matchWires():t.type==='single'||t.type==='clue'?selected.length===1&&selected[0]===t.correct:selected.length===t.correct.length&&t.correct.every(x=>selected.includes(x));let feedback=game.querySelector('#feedback');if(!good){attempts++;feedback.innerHTML='<div class="notice bad">Noch nicht richtig. Prüfe deine Lösung und versuche es erneut. Du kannst dir einen Hinweis anzeigen lassen.</div>';return}feedback.innerHTML='<div class="notice">✓ AUFTRAG ERFÜLLT. Deine Lösung ist richtig.</div>';game.querySelector('#actions').innerHTML='';game.querySelector('#actions').appendChild(button('WEITER ▶',()=>{if(mission===0&&task===1){showFlicker();return}if(task+1<missions[mission].tasks.length){task++;renderTask()}else completeMission()}))}
function showFlicker(){phase='flicker';game.innerHTML=`<div class="meta"><b class="yellow">STÖRUNG!</b><span class="small">ZWISCHENSEQUENZ</span></div><div class="cutscene">${img('scene_4.jpg')}<div class="subtitle"><b class="label">RICO // FUNK</b><br>„Es funktioniert! … Moment. Die Lampe flackert … jetzt ist sie wieder aus. Was ist passiert?“</div></div>`;speech('Es funktioniert! Moment. Die Lampe flackert. Jetzt ist sie wieder aus. Was ist passiert?');setTimeout(()=>{game.appendChild(button('URSACHE UNTERSUCHEN',()=>{task++;renderTask()}))},1400)}
function completeMission(){if(mission<3)earned[mission]=true;phase='reward';let d=missions[mission];game.innerHTML=`${img(mission===0?'scene_4.jpg':d.scene)}<div class="end"><strong>${mission===3?'MISSION COMPLETE':'MISSION ERFÜLLT'}</strong><h2>${mission===3?'STROMVERSORGUNG WIEDERHERGESTELLT':escapeHtml(d.reward)+' GESICHERT'}</h2><p>${mission===3?'Du hast alle Schaltungen erfolgreich geprüft. Die Stadt hat wieder Strom.':'Du hast alle Aufträge gelöst und den nächsten Bereich freigeschaltet.'}</p>${inventory()}<p class="small">Fehlversuche bisher: ${attempts}</p></div>`;if(mission<3)addButton('NÄCHSTE MISSION STARTEN ▶',()=>cutscene(mission+1));else addButton('SPIEL VON VORN BEGINNEN',()=>{mission=0;task=0;earned=[false,false,false];attempts=0;title()})}
title();
</script></body></html>
